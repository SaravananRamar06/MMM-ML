<text xml:space="preserve" text-anchor="middle" x="346.16" y="-101.16" font-family="Arial" font-size="14.00">What to remember</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-84.36" font-family="Arial" font-size="14.00">The data are simulations, not real experiments.</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-67.56" font-family="Arial" font-size="14.00">Nothing is checked above 200 °C.</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-50.76" font-family="Arial" font-size="14.00">Bracket results after yielding depend on the mesh, so they are estimates.</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-33.96" font-family="Arial" font-size="14.00">The 35.9 kN load is what the bracket carries before it first yields,</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-17.16" font-family="Arial" font-size="14.00">not a measured service load.</text>
</g>
