<text xml:space="preserve" text-anchor="middle" x="346.16" y="-299.68" font-family="Arial" font-size="16.00">5. Last step: the critical flaw length (done, 20 Nov 2026)</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-280.48" font-family="Arial" font-size="16.00">How long a crack at the bracket&#39;s corner fillet can get before it breaks.</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-261.28" font-family="Arial" font-size="16.00">A 2D crack model in ANSYS, checked with the BS 7910 method:</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-242.08" font-family="Arial" font-size="16.00">no crack up to 30 mm breaks it at the 35.9 kN limit load,</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-222.88" font-family="Arial" font-size="16.00">for every porosity and a toughness of 36–50 MPa√m.</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-203.68" font-family="Arial" font-size="16.00">So CL &gt; 30 mm: a bound, not an exact value.</text>
<text xml:space="preserve" text-anchor="middle" x="346.16" y="-184.48" font-family="Arial" font-size="16.00">It is one static load, not fatigue.</text>
</g>
