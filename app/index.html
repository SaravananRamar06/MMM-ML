<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlSi10Mg Aircraft Wing Bracket Curve Predictor</title>
<style>
:root {
  --paper: #F2F6F5; --grid: #D3E4E0; --grid-major: #B5D0CA; --ink: #12355B; --ink-soft: #4A6680;
  --user: #DDE3E8; --bot: #FFFFFF; --edge: #C3D3D8; --mlp: #1F5FA8; --gp: #2E8B6E;
  --warn: #A35F00; --warn-bg: #FFF4E0; --focus: #1F5FA8; --code: #E7EFF1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E2A45; --grid: #163A5C; --grid-major: #21507A; --ink: #E4EEF6; --ink-soft: #9DB7CC;
    --user: #22476B; --bot: #12324F; --edge: #2A5579; --mlp: #7FB8F0; --gp: #6FD3AE;
    --warn: #F2B33D; --warn-bg: #3A3320; --focus: #7FB8F0; --code: #1A3E60;
  }
}
:root[data-theme="dark"] {
  --paper: #0E2A45; --grid: #163A5C; --grid-major: #21507A; --ink: #E4EEF6; --ink-soft: #9DB7CC;
  --user: #22476B; --bot: #12324F; --edge: #2A5579; --mlp: #7FB8F0; --gp: #6FD3AE;
  --warn: #F2B33D; --warn-bg: #3A3320; --focus: #7FB8F0; --code: #1A3E60;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--paper);
  /* millimetre paper: 5 px minor, 25 px major */
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 125px 125px, 125px 125px, 25px 25px, 25px 25px;
  color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  display: flex; flex-direction: column;
}
.serif { font-family: Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif; }
header {
  max-width: 760px; width: 100%; margin: 0 auto; padding: 28px 16px 12px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
h1 { margin: 0; font-size: 1.9rem; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 0.95rem; }
.tools { display: flex; gap: 8px; }
.theme {
  border: 1px solid var(--edge); background: var(--bot); color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
}
main { flex: 1; overflow-y: auto; }
#log { max-width: 760px; margin: 0 auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 92%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--edge); }
.msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; width: 92%; }
.msg.bot .text { font-family: Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif; line-height: 1.6; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 4px 0 8px; padding-left: 20px; }
.msg code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
.msg table { border-collapse: collapse; margin: 6px 0 8px; font: 0.9rem/1.4 system-ui, sans-serif; font-variant-numeric: tabular-nums; width: 100%; }
.msg th, .msg td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--edge); }
.msg th { font-weight: 600; color: var(--ink-soft); }
.msg em { color: var(--ink-soft); }
.warn {
  margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--warn-bg);
  color: var(--ink); font-size: 0.9rem; border-radius: 0 6px 6px 0;
}
.warn strong { color: var(--warn); }
figure { margin: 12px 0 4px; }
svg.chart { width: 100%; height: auto; display: block; touch-action: none; }
svg .gminor { stroke: var(--grid); stroke-width: 1; }
svg .gmajor { stroke: var(--grid-major); stroke-width: 1; }
svg .axis { stroke: var(--ink-soft); stroke-width: 1.2; }
svg text { fill: var(--ink-soft); font: 12px system-ui, sans-serif; font-variant-numeric: tabular-nums; }
svg .curve { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
svg .curve.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 0.9s ease-out forwards; }
svg .curve.gp { stroke-dasharray: 6 5; }
@keyframes draw { to { stroke-dashoffset: 0; } }
svg .cursor { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--ink-soft); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 0; border-top: 2.5px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.readout { font-size: 0.85rem; color: var(--ink); min-height: 1.4em; margin-top: 4px; font-variant-numeric: tabular-nums; }
footer { background: color-mix(in srgb, var(--paper) 88%, transparent); border-top: 1px solid var(--edge); backdrop-filter: blur(4px); }
.compose { max-width: 760px; margin: 0 auto; padding: 10px 16px 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.chip {
  flex: none; border: 1px solid var(--edge); background: var(--bot); color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
}
.chip:hover { border-color: var(--mlp); }
form { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 14px; font: inherit; color: var(--ink);
  background: var(--bot); border: 1px solid var(--edge); border-radius: 12px;
}
button.send {
  height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--ink); color: var(--paper);
  font: inherit; font-weight: 600; cursor: pointer;
}
button.send:disabled { opacity: 0.55; cursor: progress; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hint { font-size: 0.8rem; color: var(--ink-soft); margin-top: 6px; }
.typing { color: var(--ink-soft); font-style: italic; }
@media (prefers-reduced-motion: reduce) { svg .curve.draw { animation: none; stroke-dashoffset: 0; } }
@media (max-width: 560px) { h1 { font-size: 1.5rem; } .msg, .msg.bot { max-width: 100%; width: 100%; } header { padding-top: 18px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 class="serif">AlSi10Mg wing bracket curve predictor</h1>
    <p class="sub" id="sub">Aircraft wing bracket · Ask for a stress–strain curve in plain words.</p>
    <p class="sub"><a href="/workflow" style="color:var(--ink)">Porosity studies and solver-result comparison →</a></p>
  </div>
  <div class="tools">
    <button class="theme" id="clear" type="button" aria-label="Clear the conversation">Clear</button>
    <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Blueprint</button>
  </div>
</header>
<main id="scroll"><div id="log" aria-live="polite"></div></main>
<footer>
  <div class="compose">
    <div class="chips" id="chips" aria-label="Example questions"></div>
    <form id="form">
      <label for="q" class="sr" style="position:absolute;left:-9999px">Your question</label>
      <textarea id="q" rows="1" placeholder="e.g. compare 30 and 200 C at rate 1e-3" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit">Predict</button>
    </form>
    <div class="hint">Enter to send, Shift+Enter for a new line, ↑ to recall your last question. Runs locally; no data leaves this computer.</div>
  </div>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const log = $('#log'), scroll = $('#scroll'), q = $('#q'), send = $('#send');
const EXAMPLES = ['stress curve at 150 C, rate 1e-4', 'compare 30, 100 and 200 C at 1e-3 /s',
  'stress at 5% strain for 100C, density 2619, G 24541', 'what ranges are valid?', 'how accurate is it?', 'help'];

// ---- theme (per-viewer preference only)
const root = document.documentElement;
function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function isDark() { const t = root.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function syncTheme() { $('#theme').textContent = isDark() ? 'Graph paper' : 'Blueprint'; }
if (load('theme')) root.dataset.theme = load('theme');
syncTheme();
$('#theme').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; store('theme', root.dataset.theme); syncTheme(); };

// ---- tiny, safe markdown: escape first, then tables / lists / bold / italic / code
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_]+)_(?=[\s.,)]|$)/g, '$1<em>$2</em>');
}
function md(text) {
  const out = []; const lines = text.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\|.*\|$/.test(l.trim())) {
      const rows = []; while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) rows.push(lines[i++].trim());
      const cells = (r) => r.slice(1, -1).split('|').map((c) => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|[\s|:-]+\|$/.test(r)));
      out.push('<table><thead><tr>' + cells(body[0]).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'
        + body.slice(1).map((r) => '<tr>' + cells(r).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
    } else if (/^- /.test(l)) {
      const items = []; while (i < lines.length && /^- /.test(lines[i])) items.push('<li>' + inline(lines[i++].slice(2)) + '</li>');
      out.push('<ul>' + items.join('') + '</ul>');
    } else if (l.trim() === '') { i++; }
    else { const para = []; while (i < lines.length && lines[i].trim() !== '' && !/^(\||- )/.test(lines[i].trim())) para.push(inline(lines[i++])); out.push('<p>' + para.join('<br>') + '</p>'); }
  }
  return out.join('');
}

// ---- chart: SVG on graph paper, with hover/touch readout
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }
let UNIT_SHORT = 'inferred units';
const PALETTE = ['--mlp', '--gp', '#B0476B', '#7A5BC4', '#C27C0E', '#3C8DAD'];
function chart(curves) {
  const W = 640, H = 340, m = { l: 52, r: 14, t: 12, b: 40 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ymax = niceMax(Math.max(...curves.flatMap((c) => c.stress)) * 1.05), xmax = 0.1;
  const X = (x) => m.l + x / xmax * iw, Y = (y) => m.t + ih - Math.max(0, y) / ymax * ih;
  const fig = document.createElement('figure');
  const svg = el('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Predicted stress–strain curves' }, fig);
  for (let k = 0; k <= 20; k++) el('line', { class: k % 4 ? 'gminor' : 'gmajor', x1: X(k * xmax / 20), x2: X(k * xmax / 20), y1: m.t, y2: m.t + ih }, svg);
  for (let k = 0; k <= 10; k++) el('line', { class: k % 2 ? 'gminor' : 'gmajor', x1: m.l, x2: m.l + iw, y1: Y(k * ymax / 10), y2: Y(k * ymax / 10) }, svg);
  el('line', { class: 'axis', x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }, svg);
  el('line', { class: 'axis', x1: m.l, x2: m.l, y1: m.t, y2: m.t + ih }, svg);
  for (let k = 0; k <= 5; k++) { const t = el('text', { x: X(k * 0.02), y: m.t + ih + 18, 'text-anchor': 'middle' }, svg); t.textContent = (k * 0.02).toFixed(2); }
  for (let k = 0; k <= 5; k++) { const t = el('text', { x: m.l - 8, y: Y(k * ymax / 5) + 4, 'text-anchor': 'end' }, svg); t.textContent = Math.round(k * ymax / 5); }
  el('text', { x: m.l + iw / 2, y: H - 4, 'text-anchor': 'middle' }, svg).textContent = 'axial strain';
  el('text', { x: 14, y: m.t + ih / 2, 'text-anchor': 'middle', transform: `rotate(-90 14 ${m.t + ih / 2})` }, svg).textContent = 'stress (' + UNIT_SHORT + ')';
  // colour by condition; the comparison model reuses its condition's colour, dashed
  const conds = [...new Set(curves.map((c) => c.label.replace(/, (MLP|GP)$/, '')))];
  const color = (c) => { const k = conds.indexOf(c.label.replace(/, (MLP|GP)$/, '')) % PALETTE.length; const v = PALETTE[conds.length === 1 ? (c.primary ? 0 : 1) : k]; return v.startsWith('--') ? `var(${v})` : v; };
  curves.forEach((c) => {
    const d = c.strain.map((x, i) => (i ? 'L' : 'M') + X(x).toFixed(1) + ',' + Y(c.stress[i]).toFixed(1)).join('');
    const p = el('path', { d, class: 'curve' + (c.primary ? ' draw' : ' gp'), stroke: color(c) }, svg);
    if (c.primary) p.style.setProperty('--len', 2000);  // longer than any curve in this viewBox
  });
  const cursor = el('line', { class: 'cursor', y1: m.t, y2: m.t + ih, x1: -10, x2: -10 }, svg);
  const legend = document.createElement('div'); legend.className = 'legend';
  curves.forEach((c) => { const s = document.createElement('span'); s.innerHTML = `<i class="${c.primary ? '' : 'dash'}" style="border-color:${color(c)}"></i>`; s.append(c.label); legend.appendChild(s); });
  const readout = document.createElement('div'); readout.className = 'readout'; readout.textContent = 'Point at the chart to read values.';
  const pick = (ev) => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;
    const x = Math.min(xmax, Math.max(0, (px - m.l) / iw * xmax)); const s = curves[0].strain;
    let i = 0; while (i < s.length - 1 && s[i + 1] <= x) i++;
    cursor.setAttribute('x1', X(s[i])); cursor.setAttribute('x2', X(s[i]));
    readout.textContent = `strain ${s[i].toFixed(4)}:  ` + curves.map((c) => `${c.label} ${c.stress[i].toFixed(1)}`).join(';  ');
  };
  svg.addEventListener('pointermove', pick); svg.addEventListener('pointerdown', pick);
  fig.append(legend, readout);
  return fig;
}

// ---- chat
function add(role, html) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  if (role === 'bot') { const t = document.createElement('div'); t.className = 'text'; t.innerHTML = html; d.appendChild(t); }
  else d.textContent = html;
  log.appendChild(d); scroll.scrollTop = scroll.scrollHeight; return d;
}
let last = '';
async function ask(text) {
  if (!text.trim() || send.disabled) return;
  last = text;
  add('user', text); q.value = ''; grow(); send.disabled = true;
  const wait = add('bot', '<span class="typing">Computing curves…</span>');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error('server replied ' + r.status);
    const data = await r.json();
    const t = wait.querySelector('.text'); t.innerHTML = md(data.reply || '');
    if (data.curves && data.curves.length) wait.appendChild(chart(data.curves));
    (data.warnings || []).forEach((w) => { const b = document.createElement('div'); b.className = 'warn'; b.innerHTML = '<strong>Check this:</strong> ' + esc(w); wait.appendChild(b); });
  } catch (e) {
    wait.querySelector('.text').innerHTML = md('The model server is not responding (' + esc(e.message) + '). Start it with `.venv/bin/python app/server.py`, then try again.');
  }
  send.disabled = false; scroll.scrollTop = scroll.scrollHeight; q.focus();
}
function grow() { q.style.height = 'auto'; q.style.height = Math.min(160, q.scrollHeight) + 'px'; }
q.addEventListener('input', grow);
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); }
  else if (e.key === 'ArrowUp' && !q.value && last) { e.preventDefault(); q.value = last; grow(); }
});
$('#form').addEventListener('submit', (e) => { e.preventDefault(); ask(q.value); });
EXAMPLES.forEach((x) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = x; b.onclick = () => ask(x); $('#chips').appendChild(b); });
fetch('/api/info').then((r) => r.json()).then((info) => {
  const m = info.models.find((x) => x.key === info.primary) || info.models[0];
  $('#sub').textContent = `Predicts ${info.target} from temperature, strain rate, density and shear modulus. `
    + `${m.short} error: ${m.test_rmse} on test curves, ${m.unseen_rmse} on unseen conditions (${info.units || 'inferred units'}).`;
}).catch(() => {});
const greet = () => add('bot', md('Ask me for a stress–strain curve, for example **"compare 30 and 200 C at rate 1e-3"**. I answer from models trained on the professor\'s simulations, and I tell you when a request is outside what they were trained on.'));
greet();
$('#clear').onclick = () => { log.replaceChildren(); greet(); q.focus(); };
</script>
</body>
</html>
